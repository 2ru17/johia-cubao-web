<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Open Sans', sans-serif; background-color: #111; color: white; margin: 0; padding: 0; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
        h1, h2, h3 { font-family: 'Montserrat', sans-serif; }
        .bg-aurora { background: radial-gradient(circle at 50% 0%, rgba(251, 176, 59, 0.15) 0%, transparent 50%), radial-gradient(circle at 100% 50%, rgba(251, 176, 59, 0.05) 0%, transparent 40%); }
    </style>
</head>
<body class="bg-[#111]">
    <div class="absolute inset-0 bg-aurora opacity-40 z-0"></div>
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-[#FBB03B] opacity-10 rounded-full blur-[150px] z-0 pointer-events-none"></div>

    <div class="relative z-10 px-6 max-w-2xl mx-auto">
        <h1 class="text-[8rem] md:text-[12rem] font-extrabold text-[#FBB03B] leading-none mb-0 drop-shadow-[0_0_60px_rgba(251,176,59,0.3)]">
            403
        </h1>
        <h2 class="text-3xl md:text-4xl font-bold mb-6 tracking-tight text-white mt-4">
            Restricted Area
        </h2>
        <p class="text-gray-400 text-lg mb-12 max-w-md mx-auto leading-relaxed">
            You don't have permission to access this directory or page on our server. Let's guide you back to the main sanctuary.
        </p>
        <a href="/" class="inline-flex items-center justify-center gap-2 bg-[#FBB03B] text-black font-bold px-8 py-4 rounded-full hover:bg-white transition-colors duration-300 shadow-[0_0_20px_rgba(251,176,59,0.3)]">
            Return to Homepage
        </a>
    </div>
</body>
</html>
