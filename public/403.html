<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Open Sans', sans-serif; background-color: #111; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; position: relative; }
        h1, h2, h3 { font-family: 'Montserrat', sans-serif; }
        .bg-aurora { position: absolute; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(251, 176, 59, 0.15) 0%, transparent 50%), radial-gradient(circle at 100% 50%, rgba(251, 176, 59, 0.05) 0%, transparent 40%); opacity: 0.4; z-index: 0; }
        .glow { position: absolute; top: 33%; left: 50%; transform: translate(-50%, -50%); width: 600px; height: 600px; background: #FBB03B; opacity: 0.1; border-radius: 9999px; filter: blur(150px); z-index: 0; pointer-events: none; }
        .content { position: relative; z-index: 10; padding: 0 1.5rem; max-width: 42rem; margin: 0 auto; }
        .code { font-size: clamp(6rem, 15vw, 12rem); font-weight: 800; color: #FBB03B; line-height: 1; margin: 0; filter: drop-shadow(0 0 60px rgba(251,176,59,0.3)); }
        .title { font-size: clamp(1.75rem, 4vw, 2.25rem); font-weight: 700; margin-top: 1rem; margin-bottom: 1.5rem; letter-spacing: -0.025em; color: #fff; }
        .description { color: #9ca3af; font-size: 1.125rem; margin-bottom: 3rem; max-width: 28rem; margin-left: auto; margin-right: auto; line-height: 1.625; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; background-color: #FBB03B; color: #000; font-weight: 700; padding: 1rem 2rem; border-radius: 9999px; text-decoration: none; transition: background-color 0.3s ease; box-shadow: 0 0 20px rgba(251,176,59,0.3); }
        .btn:hover { background-color: #fff; }
    </style>
</head>
<body>
    <div class="bg-aurora"></div>
    <div class="glow"></div>

    <div class="content">
        <h1 class="code">403</h1>
        <h2 class="title">Restricted Area</h2>
        <p class="description">
            You don't have permission to access this directory or page on our server. Let's guide you back to the main sanctuary.
        </p>
        <a href="/" class="btn">Return to Homepage</a>
    </div>
</body>
</html>
